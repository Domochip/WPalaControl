<h2 class="content-subhead">WPalaControl<span id="l" class="ld">Loading...</span></h2>
Hardware Version: <span id="hwversion"></span><span id="hwdetection"></span><br>
<h3 class="content-subhead">Stove infos (<span id="lastRefresh">AutoRefresh if HA configured</span>)</h3>
<dl id="liveData"></dl>
<h3 class="content-subhead">Home Automation Status</h3>
Protocol: <span id="haproto"></span><br>
<span id="hamqttstatuse" style='display:none'>
    Connection State: <span id="hamqttstatus"></span><br>
    Last Publish : <span id="hamqttlastpublish"></span><br>
</span>

<script>
    // qsp is substituted at build time by pio_pre_build_spa.py — var qsp = '#content2 ';

    function show(id, cond) { $(qsp + "#" + id).style.display = (cond ? '' : 'none'); }
    function failed() { $(qsp + "#l").innerHTML = '<span class="err">Failed</span>'; }

    function parseLiveData(response) {
        if ($(qsp + '#liveData') == undefined) return;
        var liveData = response.SUCCESS === true ? response.DATA : { MSG: response.INFO.MSG };
        for (k in liveData) {
            kForId = (/[^a-zA-Z]/.test(k[0]) ? 'a' : '') + k; //k[0] is not in a-zA-Z then we need to add 'a'
            kForId = kForId.replace(/ /g, '_');
            if ($(qsp + '#' + kForId) != undefined) {
                var existingElement = $(qsp + '#' + kForId + 'Value');
                if (existingElement.innerText != liveData[k]) {
                    existingElement.innerText = liveData[k];
                    existingElement.style.fontWeight = "bold";
                }
                else {
                    existingElement.style.fontWeight = "normal";
                }
            }
            else {
                var newElement = document.createElement("dd");
                newElement.id = kForId;
                newElement.innerHTML = k + ' : <span id="' + kForId + 'Value">' + liveData[k] + '</span>';
                $(qsp + '#liveData').appendChild(newElement);
            }
        }
        if ($(qsp + '#lastRefresh') != undefined) {
            $(qsp + '#lastRefresh').innerText = (new Date()).toLocaleString();
        }
    }

    // update displayed values from a status JSON object (from /gs or an SSE event)
    function applyStatus(status) {
        for (var k in status) {
            var e = $(qsp + '#' + k);
            if (e != undefined) e.innerHTML = status[k];
        }
    }

    // fetch the status and refresh all displayed data
    function refreshStatus() {
        getJSON("/gs" + qsp[8],
            function (GS) {
                applyStatus(GS);
                fadeOut($(qsp + "#l"));
            },
            failed
        );
    }

    // get configuration first to know which protocols are configured (0:Disabled, 1:MQTT)
    getJSON("/gc" + qsp[8],
        function (GC) {
            var haP = GC["haproto"];
            var protoNames = ["Disabled", "MQTT"];
            $(qsp + "#haproto").innerHTML = protoNames[haP];

            show("hamqttstatuse", haP == 1);

            refreshStatus();
        },
        failed
    );

    getJSON("/cgi-bin/sendmsg.lua?cmd=GET+SERN",
        parseLiveData
    );

    var statusEventSource;

    function closeStatusEventSource() {
        if (statusEventSource != undefined && statusEventSource.readyState !== 2) {
            statusEventSource.close();
        }
    }

    function connectStatusEventSource() {
        if (!window.EventSource || document.hidden) return;
        if (statusEventSource != undefined && statusEventSource.readyState !== 2) return;

        statusEventSource = new EventSource('/statusEvt' + qsp[8]);
        statusEventSource.addEventListener('message', function (e) {
            console.log('statusEvt' + qsp[8] + ' : ' + e.data);
            var msg = JSON.parse(e.data);
            if (!('SUCCESS' in msg)) applyStatus(msg);
            else parseLiveData(msg);
        });
    }

    document.addEventListener('visibilitychange', function () {
        if (document.hidden) closeStatusEventSource();
        else connectStatusEventSource();
    });

    connectStatusEventSource();
</script>
