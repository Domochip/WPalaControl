<div class="alert" id="stoveError" hidden>
    <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 7v6M12 17h.01"/></svg></span>
    <span class="lbl">Stove not answering<small id="stoveErrorMsg"></small></span>
</div>

<div class="group">
    <div class="gh">Stove<span id="l" class="ld">Loading...</span><span class="end pill" id="liveState"><span class="dot"></span><span>Waiting</span></span></div>
    <div class="live-grid" id="liveData"></div>
    <div class="gf"><span id="lastRefresh"></span> <span id="liveHint">Values refresh automatically when Home Automation is configured.</span></div>
</div>

<div class="group">
    <div class="gh">Home Automation<span class="end pill" id="mqttState" data-show="hamqttstatus"><span class="dot"></span><span data-k="hamqttstatus"></span></span></div>
    <div class="list">
        <div class="row"><span class="lbl">Protocol</span><span class="val" id="haproto">-</span></div>
        <div class="row" data-show="hamqttlastpublish"><span class="lbl">Last publish</span><span class="val"><span class="pill" id="lastPublish" data-k="hamqttlastpublish"></span></span></div>
        <div class="row" data-show="mqttconnectcount"><span class="lbl">Connections</span><span class="val" data-k="mqttconnectcount"></span></div>
    </div>
</div>

<div class="group">
    <div class="gh">Stove interface</div>
    <div class="list">
        <div class="row"><span class="lbl">Hardware version</span><span class="val" data-k="hwversion"></span></div>
        <div class="row"><span class="lbl">Detection</span><span class="val" data-k="hwdetection"></span></div>
    </div>
</div>

<script>
    // Runs as this part's init function (see registerPart in index_template.html):
    //   root : this part's <div data-part> element, query it with $('#x', root)
    //   id   : this part's id ('2'), used in API endpoints like '/gs' + id

    const age = ageLabel($('#lastRefresh', root));

    // Displays stove values (from GET SERN or an SSE event) as rows (see the live data helpers in index_template.html).
    // A failed command shows its message instead.
    function parseLiveData(response) {
        if (response.SUCCESS !== true) {
            $('#stoveError', root).hidden = false;
            $('#stoveErrorMsg', root).textContent = response.INFO?.MSG || '';
            return;
        }
        $('#stoveError', root).hidden = true;
        updateTiles($('#liveData', root), response.DATA || {});
        age.touch();
    }

    // MQTT state and last publish pills: green when OK, orange/red otherwise
    function colorPills(status) {
        if ('hamqttstatus' in status)
            $('#mqttState', root).className = 'end pill ' + (/^connected$/i.test(status.hamqttstatus) ? 'ok' : 'warn');
        if ('hamqttlastpublish' in status)
            $('#lastPublish', root).className = 'pill ' + (status.hamqttlastpublish === 'OK' ? 'ok' : 'err');
    }

    // status values (/gs2 or SSE event, both send the full status) are displayed with data-k / data-show
    loadStatus(root, id, { afterLoad: colorPills });

    // protocol name comes from the configuration (0:Disabled, 1:MQTT)
    getJSON("/gc" + id,
        function (config) {
            config ??= {};
            $("#haproto", root).textContent = ["Disabled", "MQTT"][config.haproto] ?? config.haproto;
            $('#liveHint', root).hidden = config.haproto > 0;
        },
        function () {
            showError($("#haproto", root));
        }
    );

    getJSON("/cgi-bin/sendmsg.lua?cmd=GET+SERN",
        parseLiveData,
        function () {
            parseLiveData({ SUCCESS: false, INFO: { MSG: 'request failed' } });
        }
    );

    // live updates while the page is shown: status update (no SUCCESS key) or stove values
    const stopEvents = connectEvents(id, msg => {
        if (!('SUCCESS' in msg)) {
            fillStatus(root, msg);
            colorPills(msg);
        }
        else parseLiveData(msg);
    }, $('#liveState', root));

    // cleanup called by unloadPage() when leaving this page
    return function () {
        stopEvents();
        age.stop();
    };
</script>
