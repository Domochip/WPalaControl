<h2 class="content-subhead">WPalaControl<span id="l" class="ld">Loading...</span></h2>
Hardware Version: <span data-k="hwversion"></span><span data-k="hwdetection"></span><br>
<h3 class="content-subhead">Stove infos (<span id="lastRefresh">AutoRefresh if HA configured</span>)</h3>
<dl id="liveData"></dl>
<h3 class="content-subhead">Home Automation Status</h3>
Protocol: <span id="haproto"></span><br>
<span data-show="hamqttstatus">
    Connection State: <span data-k="hamqttstatus"></span><br>
    Last Publish : <span data-k="hamqttlastpublish"></span><br>
</span>

<script>
    // Runs as this part's init function (see registerPart in index_template.html):
    //   root : this part's <div data-part> element, query it with $('#x', root)
    //   id   : this part's id ('2'), used in API endpoints like '/gs' + id

    function parseLiveData(response) {
        if ($('#liveData', root) == undefined) return;
        var liveData = response.SUCCESS === true ? response.DATA : { MSG: response.INFO.MSG };
        for (k in liveData) {
            kForId = (/[^a-zA-Z]/.test(k[0]) ? 'a' : '') + k; //k[0] is not in a-zA-Z then we need to add 'a'
            kForId = kForId.replace(/ /g, '_');
            if ($('#' + kForId, root) != undefined) {
                var existingElement = $('#' + kForId + 'Value', root);
                if (existingElement.innerText != liveData[k]) {
                    existingElement.innerText = liveData[k];
                    existingElement.style.fontWeight = "bold";
                }
                else {
                    existingElement.style.fontWeight = "normal";
                }
            }
            else {
                var newElement = document.createElement("dd");
                newElement.id = kForId;
                newElement.innerHTML = k + ' : <span id="' + kForId + 'Value">' + liveData[k] + '</span>';
                $('#liveData', root).appendChild(newElement);
            }
        }
        if ($('#lastRefresh', root) != undefined) {
            $('#lastRefresh', root).innerText = (new Date()).toLocaleString();
        }
    }

    // status values (/gs2 or SSE event, both send the full status) are displayed with data-k / data-show
    loadStatus(root, id);

    // protocol name comes from the configuration (0:Disabled, 1:MQTT)
    getJSON("/gc" + id,
        function (GC) {
            $("#haproto", root).textContent = ["Disabled", "MQTT"][GC["haproto"]] ?? GC["haproto"];
        }
    );

    getJSON("/cgi-bin/sendmsg.lua?cmd=GET+SERN",
        parseLiveData
    );

    var statusEventSource;

    function closeStatusEventSource() {
        if (statusEventSource != undefined && statusEventSource.readyState !== 2) {
            statusEventSource.close();
        }
    }

    function connectStatusEventSource() {
        if (!window.EventSource || document.hidden) return;
        if (statusEventSource != undefined && statusEventSource.readyState !== 2) return;

        statusEventSource = new EventSource('/statusEvt' + id);
        statusEventSource.addEventListener('message', function (e) {
            console.log('statusEvt' + id + ' : ' + e.data);
            var msg = JSON.parse(e.data);
            if (!('SUCCESS' in msg)) fillStatus(root, msg);
            else parseLiveData(msg);
        });
    }

    function onVisibilityChange() {
        if (document.hidden) closeStatusEventSource();
        else connectStatusEventSource();
    }

    document.addEventListener('visibilitychange', onVisibilityChange);

    connectStatusEventSource();

    // cleanup called by unloadPage() when leaving this page
    return function () {
        document.removeEventListener('visibilitychange', onVisibilityChange);
        closeStatusEventSource();
    };
</script>
