<h2 class="content-subhead">System<span id="l" class="ld">Loading...</span></h2>

SN : <span data-k="sn"></span><br>
Version : <span data-k="version"></span><br>
UpTime : <span data-k="uptime"></span><br>
Local Time : <span data-k="localtime"></span><br>
FreeHeap : <span data-k="freeheap"></span><br>

<div id="crashes" style="display:none">
Crash logged : <span data-k="crashcount"></span><br>
Crash files :
&nbsp;<a href="/crashdl" class="pure-button pure-button-primary btn-sm">Download</a>
&nbsp;<button class="pure-button pure-button-primary btn-sm btn-err" id="clrCrashes">Clear</button>
&nbsp;<span id="clrResult"></span>
</div>

<script>
    // Runs as this part's init function (see registerPart in index_template.html):
    //   root : this part's <div data-part> element, query it with $('#x', root)
    //   id   : this part's id ('0'), used in API endpoints like '/gs' + id

    loadStatus(root, id, {
        afterLoad: function (status) {
            if (status.crashcount > 0) $('#crashes', root).style.display = '';
        },
    });

    $('#clrCrashes', root).addEventListener('click', function () {
        $('#clrResult', root).textContent = '';
        post('/crashclr', null, function () {
            $('#crashes', root).style.display = 'none';
        }, function () {
            showError($('#clrResult', root));
        });
    });
</script>
