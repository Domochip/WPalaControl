<h2 class="content-subhead">System<span id="l" class="ld">Loading...</span></h2>

SN : <span id="sn"></span><br>
Version : <span id="version"></span><br>
UpTime : <span id="uptime"></span><br>
Local Time : <span id="localtime"></span><br>
FreeHeap : <span id="freeheap"></span><br>

<div id="cdiv" style="display:none">
Crash logged : <span id="crashcount"></span><br>
Crash files :<span id="cbtns">
&nbsp;<a href="/crashdl" class="pure-button pure-button-primary btn-sm">Download</a>
&nbsp;<button class="pure-button pure-button-primary btn-sm btn-err" onclick="clrCrashes()">Clear</button>
</span>
</div>

<script>
    // qsp is substituted at build time by pio_pre_build_spa.py — var qsp = '#content0 ';

    getJSON("/gs" + qsp[8], function (GS) {
        for (k in GS) {
            if ((e = $(qsp + '#' + k)) != undefined) e.innerHTML = GS[k];
        }
        if (GS.crashcount > 0) {
            $(qsp + '#cdiv').style.display = '';
        }
        fadeOut($(qsp + "#l"));
    }, function () {
        $(qsp + "#l").innerHTML = '<span class="err">Failed</span>';
    });

    function clrCrashes() {
        post('/crashclr', null, function () {
            $(qsp + '#cdiv').style.display = 'none';
        }, function () { alert('Failed to clear crashes'); });
    }
</script>
