<form id="f">
    <div class="group">
        <div class="gh">Clock<span id="l" class="ld">Loading...</span></div>
        <div class="list">
            <div class="row"><label class="lbl" for="tz">Time zone</label><select class="in" id="tz" name="tz"></select><span class="chev">›</span></div>
        </div>
        <div class="gf">Local time is synchronised over the internet (NTP) once WiFi is connected.</div>
    </div>
</form>

<script>
    // Runs as this part's init function (see registerPart in index_template.html):
    //   root : this part's <div data-part> element, query it with $('#x', root)
    //   id   : this part's id ('0'), used in API endpoints like '/gs' + id

    // Populate timezone dropdown
    function populateTimezones() {
        // Timezone data: display name | POSIX TZ string
        const TIMEZONE_DATA = [
            'Africa/Cairo|EET-2',
            'Africa/Johannesburg|SAST-2',
            'Africa/Lagos|WAT-1',
            'Africa/Nairobi|EAT-3',
            'America/Anchorage|AKST9AKDT,M3.2.0,M11.1.0',
            'America/Buenos_Aires|ART3',
            'America/Chicago|CST6CDT,M3.2.0,M11.1.0',
            'America/Denver|MST7MDT,M3.2.0,M11.1.0',
            'America/Los_Angeles|PST8PDT,M3.2.0,M11.1.0',
            'America/Mexico_City|CST6CDT,M4.1.0,M10.5.0',
            'America/New_York|EST5EDT,M3.2.0,M11.1.0',
            'America/Sao_Paulo|BRST3BRDT,M10.3.0/0,M2.3.0/0',
            'America/Toronto|EST5EDT,M3.2.0,M11.1.0',
            'Asia/Bangkok|ICT-7',
            'Asia/Dubai|GST-4',
            'Asia/Hong_Kong|HKT-8',
            'Asia/Seoul|KST-9',
            'Asia/Shanghai|CST-8',
            'Asia/Tokyo|JST-9',
            'Australia/Brisbane|AEST-10',
            'Australia/Melbourne|AEST-10AEDT,M10.1.0,M4.1.0/3',
            'Australia/Sydney|AEST-10AEDT,M10.1.0,M4.1.0/3',
            'Europe/Amsterdam|CET-1CEST,M3.5.0,M10.5.0/3',
            'Europe/Athens|EET-2EEST,M3.5.0/3,M10.5.0/4',
            'Europe/Berlin|CET-1CEST,M3.5.0,M10.5.0/3',
            'Europe/Brussels|CET-1CEST,M3.5.0,M10.5.0/3',
            'Europe/Budapest|CET-1CEST,M3.5.0,M10.5.0/3',
            'Europe/Helsinki|EET-2EEST,M3.5.0/3,M10.5.0/4',
            'Europe/Istanbul|EET-2EEST,M3.5.0/3,M10.5.0/4',
            'Europe/London|GMT0BST,M3.5.0/1,M10.5.0',
            'Europe/Madrid|CET-1CEST,M3.5.0,M10.5.0/3',
            'Europe/Paris|CET-1CEST,M3.5.0,M10.5.0/3',
            'Europe/Prague|CET-1CEST,M3.5.0,M10.5.0/3',
            'Europe/Rome|CET-1CEST,M3.5.0,M10.5.0/3',
            'Europe/Stockholm|CET-1CEST,M3.5.0,M10.5.0/3',
            'Europe/Vienna|CET-1CEST,M3.5.0,M10.5.0/3',
            'Europe/Warsaw|CET-1CEST,M3.5.0,M10.5.0/3',
            'Pacific/Auckland|NZST-12NZDT,M9.5.0,M4.1.0/3',
            'Pacific/Honolulu|HST10',
            'UTC|UTC0',
        ];

        const select = $('#tz', root);
        const defaultValue = 'Europe/Paris|CET-1CEST,M3.5.0,M10.5.0/3';

        TIMEZONE_DATA.forEach(tz => {
            const [displayName, posixString] = tz.split('|');
            const option = document.createElement('option');
            option.value = tz; // Full value: displayName|posixString
            option.textContent = displayName;
            if (tz === defaultValue) {
                option.selected = true;
            }
            select.appendChild(option);
        });
    }

    // Timezone options must exist before the configuration is loaded into the form
    populateTimezones();
    configForm(root, id);
</script>
