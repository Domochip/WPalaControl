<h2 class="content-subhead">System<span id="l" class="ld">Loading...</span></h2>

<form class="pure-form pure-form-aligned" id='f' method='POST' action='/sc0'>
    <fieldset>
        <div class="pure-control-group">
            <label for="tz">NTP Timezone</label>
            <select id='tz' name='tz'>
            </select>
            <span class="pure-form-message-inline">Select your timezone</span>
        </div>
        <div class="pure-controls">
            <input type='submit' value='Save' class="pure-button pure-button-primary" disabled>
        </div>
    </fieldset>
</form>
<span id='r'></span>

<form class="pure-form pure-form-aligned" id='f0' method='POST' action='/rbt'>
    <fieldset>
        <div class="pure-controls">
            <input type='submit' name='subRbt' id='subRbt' value='Reboot' class="pure-button pure-button-primary btn-warn">
        </div>
    </fieldset>
</form>
<form class="pure-form pure-form-aligned" id='f0b' method='POST' action='/rbtrsc'>
    <fieldset>
        <div class="pure-controls">
            <input type='submit' name='subRbtRsc' id='subRbtRsc' value='Reboot in Rescue Mode'
                class="pure-button pure-button-primary btn-err">
        </div>
    </fieldset>
</form>

<script>
    // Runs as this part's init function (see registerPart in index_template.html):
    //   root : this part's <div data-part> element, query it with $('#x', root)
    //   id   : this part's id ('0'), used in API endpoints like '/gs' + id

    // Populate timezone dropdown
    function populateTimezones() {
        // Timezone data: display name | POSIX TZ string
        const TIMEZONE_DATA = [
            'Africa/Cairo|EET-2',
            'Africa/Johannesburg|SAST-2',
            'Africa/Lagos|WAT-1',
            'Africa/Nairobi|EAT-3',
            'America/Anchorage|AKST9AKDT,M3.2.0,M11.1.0',
            'America/Buenos_Aires|ART3',
            'America/Chicago|CST6CDT,M3.2.0,M11.1.0',
            'America/Denver|MST7MDT,M3.2.0,M11.1.0',
            'America/Los_Angeles|PST8PDT,M3.2.0,M11.1.0',
            'America/Mexico_City|CST6CDT,M4.1.0,M10.5.0',
            'America/New_York|EST5EDT,M3.2.0,M11.1.0',
            'America/Sao_Paulo|BRST3BRDT,M10.3.0/0,M2.3.0/0',
            'America/Toronto|EST5EDT,M3.2.0,M11.1.0',
            'Asia/Bangkok|ICT-7',
            'Asia/Dubai|GST-4',
            'Asia/Hong_Kong|HKT-8',
            'Asia/Seoul|KST-9',
            'Asia/Shanghai|CST-8',
            'Asia/Tokyo|JST-9',
            'Australia/Brisbane|AEST-10',
            'Australia/Melbourne|AEST-10AEDT,M10.1.0,M4.1.0/3',
            'Australia/Sydney|AEST-10AEDT,M10.1.0,M4.1.0/3',
            'Europe/Amsterdam|CET-1CEST,M3.5.0,M10.5.0/3',
            'Europe/Athens|EET-2EEST,M3.5.0/3,M10.5.0/4',
            'Europe/Berlin|CET-1CEST,M3.5.0,M10.5.0/3',
            'Europe/Brussels|CET-1CEST,M3.5.0,M10.5.0/3',
            'Europe/Budapest|CET-1CEST,M3.5.0,M10.5.0/3',
            'Europe/Helsinki|EET-2EEST,M3.5.0/3,M10.5.0/4',
            'Europe/Istanbul|EET-2EEST,M3.5.0/3,M10.5.0/4',
            'Europe/London|GMT0BST,M3.5.0/1,M10.5.0',
            'Europe/Madrid|CET-1CEST,M3.5.0,M10.5.0/3',
            'Europe/Paris|CET-1CEST,M3.5.0,M10.5.0/3',
            'Europe/Prague|CET-1CEST,M3.5.0,M10.5.0/3',
            'Europe/Rome|CET-1CEST,M3.5.0,M10.5.0/3',
            'Europe/Stockholm|CET-1CEST,M3.5.0,M10.5.0/3',
            'Europe/Vienna|CET-1CEST,M3.5.0,M10.5.0/3',
            'Europe/Warsaw|CET-1CEST,M3.5.0,M10.5.0/3',
            'Pacific/Auckland|NZST-12NZDT,M9.5.0,M4.1.0/3',
            'Pacific/Honolulu|HST10',
            'UTC|UTC0',
        ];
        
        const select = $('#tz', root);
        const defaultValue = 'Europe/Paris|CET-1CEST,M3.5.0,M10.5.0/3';
        
        TIMEZONE_DATA.forEach(tz => {
            const [displayName, posixString] = tz.split('|');
            const option = document.createElement('option');
            option.value = tz; // Full value: displayName|posixString
            option.textContent = displayName;
            if (tz === defaultValue) {
                option.selected = true;
            }
            select.appendChild(option);
        });
    }

    $("#f", root).addEventListener('submit', function (event) {
        event.preventDefault();
        $('#r', root).innerHTML = "Saving Configuration...";
        post("/sc" + id,
            convertFormToJson($("#f", root)),
            function () {
                $("#f", root).style.display = 'none';

                sessionStorage.setItem('activeTab', '#menuConfig');

                $('#r', root).innerHTML = '<h3><b>Configuration saved <span class="ok">successfully</span>. System is restarting now.</b></h3>Waiting for device... <span id="cd">0</span>s';
                redirectWhenReachable(location.origin, 30000);
            },
            function () {
                $('#r', root).innerHTML = '<h3><b>Configuration <span class="err">error</span>.</b></h3>';
            }
        );
    });

    // Load configuration
    getJSON("/gc" + id,
        function (GC) {
            // Populate timezone dropdown first
            populateTimezones();

            for (k in GC) {
                if ($('#' + k, root)) {
                    if ($('#' + k, root).type != 'checkbox') $('#' + k, root).value = GC[k];
                    else $('#' + k, root).checked = GC[k];

                    triggerEvent($('#' + k, root), 'change');
                }
            }

            $("#f input[type=submit]", root).disabled = false;
            fadeOut($("#l", root));
        }, 
        function () {
            $("#l", root).innerHTML = '<span class="err">Failed</span>';
        }
    );

    function postFailed() {
        $('#r', root).innerHTML = '<span class="err">Failed</span>';
        $('#f0', root).reset();
        $('#f0b', root).reset();
        $('#subRbt', root).disabled = false;
        $('#subRbtRsc', root).disabled = false;
    };

    function handleSubmit(event, url, successMessage, targetUrl) {
        event.preventDefault();
        $('#subRbt', root).disabled = true;
        $('#subRbtRsc', root).disabled = true;

        post(url, null, function () {
            $('#r', root).innerHTML = `<h3><span class="ok">Done</span> ${successMessage} Waiting for device... <span id="cd">0</span>s</h3>`;
            redirectWhenReachable(targetUrl, 30000);
        }, postFailed);
    }

    $("#f0", root).addEventListener('submit', function (evt) {
        handleSubmit(evt, '/rbt', 'System will reboot shortly.', location.origin);
    });

    $("#f0b", root).addEventListener('submit', function (evt) {
        handleSubmit(evt, '/rbt?rescue=true', 'System will reboot shortly in RESCUE MODE. You\'ll need to connect to module WiFi.', 'http://192.168.4.1');
    });
</script>
