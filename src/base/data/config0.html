<h2 class="content-subhead">System<span id="l" class="ld">Loading...</span></h2>

<form class="pure-form pure-form-aligned" id='f'>
    <fieldset>
        <div class="pure-control-group">
            <label for="tz">NTP Timezone</label>
            <select id='tz' name='tz'>
            </select>
            <span class="pure-form-message-inline">Select your timezone</span>
        </div>
        <div class="pure-control-group">
            <label for="ntps">NTP Server</label>
            <input type='text' id='ntps' name='ntps' maxlength='64' pattern='[A-Za-z0-9\-.]+' placeholder="pool.ntp.org">
            <span class="pure-form-message-inline">IP or DNS name (empty: pool.ntp.org)</span>
        </div>
        <div class="pure-control-group">
            <label for="wp">Web Password</label>
            <input type='password' id='wp' name='wp' maxlength='64'>
            <span class="pure-form-message-inline">User "admin" (empty: no authentication)</span>
        </div>
        <div class="pure-controls">
            <input type='submit' value='Save' class="pure-button pure-button-primary" disabled>
        </div>
    </fieldset>
</form>
<span id='r'></span>

<h2 class="content-subhead">Backup / Restore</h2>
<form class="pure-form pure-form-aligned" id='backupForm'>
    <fieldset>
        <div class="pure-control-group">
            <label>Backup</label>
            <button type='button' id='bkBtn' class="pure-button pure-button-primary">Download</button>
            <span class="pure-form-message-inline">WiFi settings are not included</span>
        </div>
        <div class="pure-control-group">
            <label for="rsFile">Restore</label>
            <input type='file' id='rsFile' accept='.json' required>
            <input type='submit' id='subRs' value='Restore' class="pure-button pure-button-primary btn-warn" disabled>
        </div>
    </fieldset>
</form>
<div id='rsResult'></div>

<h2 class="content-subhead">Maintenance</h2>
<form class="pure-form pure-form-aligned" id='maintForm'>
    <fieldset>
        <div class="pure-control-group">
            <label>Module</label>
            <button type='button' id='subRbt' class="pure-button pure-button-primary btn-warn">Reboot</button>
            <button type='button' id='subRst' class="pure-button pure-button-primary btn-err">Reset Configuration</button>
        </div>
    </fieldset>
</form>
<div id='mResult'></div>

<script>
    // Runs as this part's init function (see registerPart in index_template.html):
    //   root : this part's <div data-part> element, query it with $('#x', root)
    //   id   : this part's id ('0'), used in API endpoints like '/gs' + id

    // Populate timezone dropdown
    function populateTimezones() {
        // Timezone data: display name | POSIX TZ string
        const TIMEZONE_DATA = [
            'Africa/Cairo|EET-2',
            'Africa/Johannesburg|SAST-2',
            'Africa/Lagos|WAT-1',
            'Africa/Nairobi|EAT-3',
            'America/Anchorage|AKST9AKDT,M3.2.0,M11.1.0',
            'America/Buenos_Aires|ART3',
            'America/Chicago|CST6CDT,M3.2.0,M11.1.0',
            'America/Denver|MST7MDT,M3.2.0,M11.1.0',
            'America/Los_Angeles|PST8PDT,M3.2.0,M11.1.0',
            'America/Mexico_City|CST6CDT,M4.1.0,M10.5.0',
            'America/New_York|EST5EDT,M3.2.0,M11.1.0',
            'America/Sao_Paulo|BRST3BRDT,M10.3.0/0,M2.3.0/0',
            'America/Toronto|EST5EDT,M3.2.0,M11.1.0',
            'Asia/Bangkok|ICT-7',
            'Asia/Dubai|GST-4',
            'Asia/Hong_Kong|HKT-8',
            'Asia/Seoul|KST-9',
            'Asia/Shanghai|CST-8',
            'Asia/Tokyo|JST-9',
            'Australia/Brisbane|AEST-10',
            'Australia/Melbourne|AEST-10AEDT,M10.1.0,M4.1.0/3',
            'Australia/Sydney|AEST-10AEDT,M10.1.0,M4.1.0/3',
            'Europe/Amsterdam|CET-1CEST,M3.5.0,M10.5.0/3',
            'Europe/Athens|EET-2EEST,M3.5.0/3,M10.5.0/4',
            'Europe/Berlin|CET-1CEST,M3.5.0,M10.5.0/3',
            'Europe/Brussels|CET-1CEST,M3.5.0,M10.5.0/3',
            'Europe/Budapest|CET-1CEST,M3.5.0,M10.5.0/3',
            'Europe/Helsinki|EET-2EEST,M3.5.0/3,M10.5.0/4',
            'Europe/Istanbul|EET-2EEST,M3.5.0/3,M10.5.0/4',
            'Europe/London|GMT0BST,M3.5.0/1,M10.5.0',
            'Europe/Madrid|CET-1CEST,M3.5.0,M10.5.0/3',
            'Europe/Paris|CET-1CEST,M3.5.0,M10.5.0/3',
            'Europe/Prague|CET-1CEST,M3.5.0,M10.5.0/3',
            'Europe/Rome|CET-1CEST,M3.5.0,M10.5.0/3',
            'Europe/Stockholm|CET-1CEST,M3.5.0,M10.5.0/3',
            'Europe/Vienna|CET-1CEST,M3.5.0,M10.5.0/3',
            'Europe/Warsaw|CET-1CEST,M3.5.0,M10.5.0/3',
            'Pacific/Auckland|NZST-12NZDT,M9.5.0,M4.1.0/3',
            'Pacific/Honolulu|HST10',
            'UTC|UTC0',
        ];
        
        const select = $('#tz', root);
        const defaultValue = 'Europe/Paris|CET-1CEST,M3.5.0,M10.5.0/3';
        
        TIMEZONE_DATA.forEach(tz => {
            const [displayName, posixString] = tz.split('|');
            const option = document.createElement('option');
            option.value = tz; // Full value: displayName|posixString
            option.textContent = displayName;
            if (tz === defaultValue) {
                option.selected = true;
            }
            select.appendChild(option);
        });
    }

    // Timezone options must exist before the configuration is loaded into the form
    populateTimezones();
    configForm(root, id);

    function reboot(url, successMessage, targetUrl) {
        $('#subRbt', root).disabled = true;
        $('#subRst', root).disabled = true;

        post(url, null, function () {
            waitForDevice($('#mResult', root), targetUrl, 30000, `<h3><span class="ok">Done</span> ${successMessage}</h3>`);
        }, function () {
            showError($('#mResult', root));
            $('#subRbt', root).disabled = false;
            $('#subRst', root).disabled = false;
        });
    }

    // serial number of this module, used to warn when restoring a backup from another module
    let deviceSn = '';
    getJSON('/gs0', (status) => { deviceSn = status.sn || ''; });

    // Download backup: fetched then saved as a file (keeps the name sent by the firmware)
    $('#bkBtn', root).addEventListener('click', function () {
        if (!confirm('Download a configuration backup?\n\n⚠ The file contains passwords in clear text: the Web Password and application passwords (MQTT server, etc.). Store it somewhere safe and do not share it.\n\nWiFi settings are not included.'))
            return;
        const btn = this;
        btn.disabled = true;
        fetch('/cfgbk')
            .then(response => {
                if (!response.ok) throw new Error(response.status);
                const match = (response.headers.get('Content-Disposition') || '').match(/filename="([^"]+)"/);
                let name = match ? match[1] : 'config.json';
                // module time not synchronized (no date in name): use browser date instead
                if (!/_\d{8}-\d{4}\.json$/.test(name)) {
                    const d = new Date(), p = (n) => String(n).padStart(2, '0');
                    name = name.replace(/\.json$/, `_${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.json`);
                }
                return response.blob().then(blob => ({ blob, name }));
            })
            .then(({ blob, name }) => {
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = name;
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(a.href), 1000);
            })
            .catch(error => showError($('#rsResult', root), error.message))
            .finally(() => { btn.disabled = false; });
    });

    // Restore button is enabled only once a file is selected
    $('#rsFile', root).addEventListener('change', function () {
        $('#subRs', root).disabled = !this.files.length;
        $('#rsResult', root).innerHTML = '';
    });

    // Restore: file is read by the browser then its content is posted to the firmware
    $("#backupForm", root).addEventListener('submit', function (evt) {
        evt.preventDefault();
        const file = $('#rsFile', root).files[0];
        if (!file) return;
        const model = document.querySelector("meta[name='description']").content;

        file.text().then(text => {
            let backup;
            try { backup = JSON.parse(text); } catch (e) { backup = null; }
            if (!backup || typeof backup !== 'object' || backup.model !== model) {
                alert(`This file is not a ${model} configuration backup.`);
                return;
            }

            // explain what will be restored before going further (⚠ = warning sign)
            const origin = [`module ${backup.sn || 'unknown'}`];
            if (backup.version) origin.push(`firmware ${backup.version}`);
            if (backup.date) origin.push(`saved ${backup.date}`);
            const lines = ['Restore this configuration backup?', '', `From: ${origin.join(', ')}`];
            if (backup.sn && deviceSn && backup.sn !== deviceSn)
                lines.push('⚠ This backup was made on another module.');
            lines.push('', 'Settings that will be replaced:');
            if (backup.Core) lines.push('  - System: NTP Timezone, Web Password');
            if (backup[model]) lines.push(`  - ${model} settings`);
            lines.push('WiFi settings are kept as they are.');
            if (backup.Core && typeof backup.Core.wp === 'string') {
                lines.push('');
                if (backup.Core.wp)
                    lines.push('⚠ The Web Password saved in the backup will replace the current one. Make sure you know it, or you will be locked out of this web interface.');
                else
                    lines.push('⚠ The backup has no Web Password: this web interface will no longer ask for one.');
            }
            lines.push('', 'System will restart to apply the backup.');
            if (!confirm(lines.join('\n'))) return;

            $('#subRs', root).disabled = true;
            $('#bkBtn', root).disabled = true;
            $('#rsResult', root).innerHTML = 'Restoring Configuration...';
            post('/cfgrs', text,
                () => {
                    $('#backupForm', root).style.display = 'none';
                    sessionStorage.setItem('activeTab', '#menuConfig');
                    waitForDevice($('#rsResult', root), location.origin, 30000, '<h3><b>Configuration restored <span class="ok">successfully</span>. System is restarting now.</b></h3>');
                },
                (responseText) => {
                    showError($('#rsResult', root), responseText);
                    $('#subRs', root).disabled = false;
                    $('#bkBtn', root).disabled = false;
                });
        });
    });

    $("#subRbt", root).addEventListener('click', function () {
        reboot('/rbt', 'System will reboot shortly.', location.origin);
    });

    $("#subRst", root).addEventListener('click', function () {
        if (!confirm('All settings will be erased and System will restart with its default configuration. Continue?'))
            return;
        reboot('/rstcfg', "Configuration erased. System will reboot shortly. You'll need to connect to module WiFi.", 'http://192.168.4.1');
    });
</script>
