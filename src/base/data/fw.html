<div class="card">
    <div class="fw-hero">
        <div class="ver"><div class="l">Installed</div><div class="n" data-k="installed_version"></div></div>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--faint)" stroke-width="2" stroke-linecap="round" data-show="latest_version" style="display:none"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        <div class="ver" data-show="latest_version" style="display:none"><div class="l">Available</div><div class="n" data-k="latest_version" style="color:var(--accent)"></div></div>
        <div class="act">
            <button class="btn" id="refreshButton">Check again</button>
            <button class="btn primary" id="updateButton" disabled>Install update</button>
        </div>
    </div>
    <!-- online update progress (each update path has its own bar, in its own card) -->
    <div class="progress" id="onlineProgress" hidden>
        <div class="bar"><i></i></div>
        <div class="lbl"><span class="txt"></span><span class="pct">0%</span></div>
    </div>
    <!-- reason sent by the firmware when no update info is available -->
    <div class="notes" data-show="error" style="display:none">
        <span class="err">Online update unavailable:</span> <span data-k="error"></span>
    </div>
    <!-- release details: shown only when update info is available (latest_version is sent) -->
    <div class="notes" data-show="latest_version" style="display:none">
        <h3 data-k="title"></h3>
        <div class="meta">Released <span data-k="release_date"></span> · <a data-k="release_url" target="_blank">View on GitHub ↗</a></div>
        <div class="sum" id="summary"></div>
    </div>
    <div class="notes" id="loadingOnline">Checking for updates...</div>
</div>

<div class="section-title">Manual update</div>
<div class="card">
    <form class="card-b" id="f">
        <label class="drop" id="drop">
            <input type="file" name="fi" id="firmwareFile" accept=".bin" hidden>
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
            <b>Drop a firmware file here</b>
            <span>or click to browse · <span class="mono" id="expectedName"></span> expected</span>
        </label>
        <div class="file-chip" id="fileChip" hidden>
            <span class="nm" id="fileName"></span>
            <span class="pill ok">Valid</span>
            <button type="submit" id="uploadButton" class="btn primary sm">Flash</button>
        </div>
        <!-- manual upload progress -->
        <div class="progress" id="uploadProgress" hidden style="padding:14px 0 0">
            <div class="bar"><i></i></div>
            <div class="lbl"><span class="txt"></span><span class="pct">0%</span></div>
        </div>
    </form>
</div>

<script>
    // Runs as this part's init function (see registerPart in index_template.html):
    //   root : this part's <div data-part> element, query it with $('#x', root)
    //   id   : this part's id ('', single-part page, not used here)

    const model = document.querySelector("meta[name='description']").content;
    $('#expectedName', root).textContent = model + '.x.y.z.bin';

    function isValidFirmwareFile(file) {
        // Define the patterns for the filename
        const esp32Pattern = '(\\.esp32)?';
        const versionPattern = '(\\.\\d+\\.\\d+\\.\\d+)?';
        const filenamePattern1 = new RegExp(`^${model}${esp32Pattern}${versionPattern}.*\\.bin$`, 'i');
        let filenamePattern2 = null;

        // If model starts with 'W', define an additional pattern
        if (model.startsWith('W')) {
            const modelWithoutFirstChar = model.substring(1);
            filenamePattern2 = new RegExp(`^Wireless${modelWithoutFirstChar}${esp32Pattern}${versionPattern}.*\\.bin$`, 'i');
        }

        // Check if the filename matches either pattern
        return filenamePattern1.test(file.name) || (filenamePattern2 && filenamePattern2.test(file.name));
    }

    // Compares two "x.y.z" versions: returns -1 if a < b, 1 if a > b, 0 if equal
    function compareVersions(a, b) {
        const aParts = a.split('.').map(Number);
        const bParts = b.split('.').map(Number);

        for (let i = 0; i < Math.max(aParts.length, bParts.length); i++) {
            const aPart = aParts[i] || 0;
            const bPart = bParts[i] || 0;
            if (aPart < bPart) { return -1; }
            if (aPart > bPart) { return 1; }
        }
        return 0;
    }

    // Asks confirmation before flashing, in a dialog summarizing the change:
    //   target  : version to install ('' when unknown, e.g. a file without version in its name)
    //   details : [[label, value], ...] shown under the versions (values set as plain text)
    // Returns a Promise of true when confirmed
    function confirmFlash(title, target, details, confirmLabel) {
        const installed = $('[data-k="installed_version"]', root).textContent;
        const body = html(`<div>
            <div class="vchange"><span class="from"></span><span>&rarr;</span><span class="to"></span><span class="pill"></span></div>
            <dl class="kv"></dl>
            <ul class="warn-box">
                <li>Keep the module powered on until it restarts: an interrupted flash may need a cable to recover.</li>
                <li>Keep this page open: it reloads by itself once the module is back (about a minute).</li>
                <li>Settings are kept.</li>
            </ul>
        </div>`);
        body.style.cssText = 'display:grid;gap:14px';
        $('.from', body).textContent = installed || 'current';
        $('.to', body).textContent = target || '?';

        // upgrade / reinstall / downgrade, compared with the installed version
        const pill = $('.pill', body);
        if (target && installed) {
            const order = compareVersions(target, installed);
            pill.textContent = order > 0 ? 'Upgrade' : order < 0 ? 'Downgrade' : 'Reinstall';
            pill.classList.add(order > 0 ? 'ok' : order < 0 ? 'warn' : 'off');
        } else {
            pill.textContent = 'Unknown version';
            pill.classList.add('warn');
        }

        for (const [label, value] of details) {
            const row = html('<div><dt></dt><dd></dd></div>');
            row.firstChild.textContent = label;
            row.lastChild.textContent = value;
            $('.kv', body).append(row);
        }

        return confirmDialog({ title, body, confirmLabel });
    }

    let busy = false; // an update or upload is running: everything stays disabled

    function disableAllButtons() {
        busy = true;
        $('#refreshButton', root).disabled = true;
        $('#updateButton', root).disabled = true;
        $('#uploadButton', root).disabled = true;
    }

    function resetButtons() {
        busy = false;
        $('#refreshButton', root).disabled = false;
        $('#uploadButton', root).disabled = false;

        const installedVersion = $('[data-k="installed_version"]', root).textContent;
        const latestVersion = $('[data-k="latest_version"]', root).textContent;
        const updateButton = $('#updateButton', root);
        const newer = latestVersion && compareVersions(latestVersion, installedVersion) > 0;
        updateButton.disabled = !newer;
        updateButton.textContent = newer || !latestVersion ? 'Install update' : 'Up to date';
    }

    // progress: the .progress block of the running update (#onlineProgress or #uploadProgress)
    function showProgress(progress, text, percent) {
        progress.hidden = false;
        $('.txt', progress).textContent = text;
        $('.pct', progress).textContent = percent + '%';
        $('.bar i', progress).style.width = percent + '%';
    }

    function hideProgress(progress) {
        progress.hidden = true;
    }

    const onlineProgress = $('#onlineProgress', root);
    const uploadProgress = $('#uploadProgress', root);

    // Release summary: a bullet list when every line is a "- " or "* " item, plain text otherwise
    function showSummary(text) {
        const lines = text.split('\n').map(line => line.trim()).filter(Boolean);
        const summary = $('#summary', root);
        if (lines.length && lines.every(line => /^[-*] /.test(line))) {
            const list = document.createElement('ul');
            for (const line of lines) list.append(Object.assign(document.createElement('li'), { textContent: line.substring(2) }));
            summary.replaceChildren(list);
        } else {
            summary.textContent = text; // line breaks kept by 'white-space: pre-line' (.sum)
        }
    }

    function getLatestUpdateInfo() {
        disableAllButtons();
        $('#refreshButton', root).textContent = 'Checking...';
        $('#loadingOnline', root).hidden = false;
        $('#loadingOnline', root).textContent = 'Checking for updates...';

        // clear previous values
        fillStatus(root, { error: '', latest_version: '', title: '', release_date: '', release_summary: '', release_url: '' });
        $('#summary', root).replaceChildren();
        $('[data-k="release_url"]', root).removeAttribute('href');

        getJSON('/glui',
            (updateInfo) => {
                fillStatus(root, updateInfo, {
                    // "2026-11-03" -> "3 Nov 2026"
                    release_date: v => {
                        const date = new Date(v);
                        return isNaN(date) ? v : date.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
                    },
                });
                showSummary(updateInfo.release_summary || '');
                // the link text stays "View on GitHub", the url becomes its target
                $('[data-k="release_url"]', root).textContent = 'View on GitHub ↗';
                if (updateInfo.release_url) $('[data-k="release_url"]', root).href = updateInfo.release_url;
                $('#loadingOnline', root).hidden = true;
                $('#refreshButton', root).textContent = 'Check again';
                resetButtons();
            },
            () => {
                showError($('#loadingOnline', root));
                $('#refreshButton', root).textContent = 'Check again';
                resetButtons();
            }
        );
    }
    getLatestUpdateInfo();
    $("#refreshButton", root).addEventListener('click', getLatestUpdateInfo);

    $("#updateButton", root).addEventListener('click', async () => {
        const version = $('[data-k="latest_version"]', root).textContent;
        const confirmed = await confirmFlash('Install update', version, [
            ['Release', $('[data-k="title"]', root).textContent],
            ['Source', 'GitHub, downloaded by the module'],
        ], 'Install ' + version);
        if (!confirmed || busy) return;
        disableAllButtons();
        showProgress(onlineProgress, 'Downloading from GitHub and flashing...', 0);

        fetch('/update', {
            method: 'POST',
            body: version
        })
            .then(response => {
                if (!response.ok) {
                    return response.text().then(text => { throw new Error(text); });
                }
                const reader = response.body.pipeThrough(new TextDecoderStream()).getReader();
                let chunkAccumulator = '';
                let success = false, message = '';

                function processChunk({ done, value }) {
                    if (done) {
                        if (success) {
                            waitForDevice(location.origin, 60000, 'Installing ' + version, 'The device is rebooting into the new firmware...');
                        } else {
                            hideProgress(onlineProgress);
                            toast('Update failed' + (message ? ': ' + message : ''), true);
                            resetButtons();
                        }
                        return;
                    }
                    chunkAccumulator += value;
                    const chunks = chunkAccumulator.split('\n');
                    chunkAccumulator = chunks.pop();
                    chunks.forEach(chunk => {
                        if (chunk.startsWith('p:')) showProgress(onlineProgress, 'Downloading from GitHub and flashing...', parseInt(chunk.substring(2)));
                        else if (chunk.startsWith('s:')) success = chunk.substring(2) === 'true';
                        else if (chunk.startsWith('m:')) message = chunk.substring(2);
                    });
                    reader.read().then(processChunk); // Read the next chunk
                }
                reader.read().then(processChunk); // Start reading chunks
            })
            .catch(error => {
                hideProgress(onlineProgress);
                toast('Update failed: ' + error.message, true);
                resetButtons();
            });
    });

    // Manual update: file chosen by click or drag & drop, checked by name, then uploaded
    const fileInput = $('#firmwareFile', root);
    const drop = $('#drop', root);

    function pickFile() {
        const file = fileInput.files[0];
        $('#fileChip', root).hidden = true;
        if (!file) return;
        if (!isValidFirmwareFile(file)) {
            toast(`${file.name} is not a firmware for ${model} (${model}.1.2.3.bin expected)`, true);
            fileInput.value = '';
            return;
        }
        $('#fileName', root).textContent = `${file.name} · ${Math.round(file.size / 1024)} KB`;
        $('#fileChip', root).hidden = false;
    }

    fileInput.addEventListener('change', pickFile);
    ['dragenter', 'dragover'].forEach(name => drop.addEventListener(name, evt => {
        evt.preventDefault();
        if (!busy) drop.classList.add('over');
    }));
    ['dragleave', 'drop'].forEach(name => drop.addEventListener(name, evt => {
        evt.preventDefault();
        drop.classList.remove('over');
    }));
    drop.addEventListener('drop', evt => {
        if (busy || !evt.dataTransfer.files.length) return;
        fileInput.files = evt.dataTransfer.files;
        pickFile();
    });
    // no new file while an update or upload is running
    drop.addEventListener('click', evt => { if (busy) evt.preventDefault(); });

    $("#f", root).addEventListener('submit', async (evt) => {
        evt.preventDefault();
        const file = fileInput.files[0];
        if (busy || !file) return;
        // version and target from the file name: WBase.esp32.1.2.3.bin
        const version = (/\.(\d+\.\d+\.\d+)/.exec(file.name) || [])[1] || '';
        const confirmed = await confirmFlash('Flash firmware file', version, [
            ['File', file.name],
            ['Size', Math.round(file.size / 1024) + ' KB'],
            // file name: Model[.esp32].x.y.z[.dev][.debug].bin (see pio_pre_define_PROGNAME.py)
            ['Build', (/\.esp32/i.test(file.name) ? 'ESP32' : 'ESP8266')
                + (/\.dev(\.|$)/i.test(file.name) ? ' · developer' : '')
                + (/\.debug(\.|$)/i.test(file.name) ? ' · debug' : '')],
        ], 'Flash');
        if (!confirmed || busy) return;
        disableAllButtons();
        showProgress(uploadProgress, 'Uploading firmware...', 0);

        post('/fw',
            new FormData($('#f', root)),
            () => {
                waitForDevice(location.origin, 60000, 'Flashing firmware', 'Upload complete, the device is rebooting...');
            },
            (responseText) => {
                hideProgress(uploadProgress);
                toast(responseText || 'Upload failed', true); // firmware message already reads "Update failed: <reason>"
                $('#f', root).reset();
                $('#fileChip', root).hidden = true;
                resetButtons();
            },
            30000,
            function (evt) {
                if (evt.lengthComputable) showProgress(uploadProgress, 'Uploading firmware...', Math.round((evt.loaded / evt.total) * 100));
            }
        );
    });
</script>
