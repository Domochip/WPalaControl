<h2>Current Firmware<span id="loadingCurrent" class="ld">Loading...</span></h2>
<div class="pure-form pure-form-aligned strong-labels">
    <div class="pure-control-group">
        <label>Version</label>
        <span data-k="installed_version"></span>
    </div>
</div>

<h2>Online Update<span id="loadingOnline" class="ld">Loading...</span></h2>
<div class="pure-form pure-form-aligned strong-labels">
    <!-- reason sent by the firmware when no update info is available -->
    <div class="pure-control-group" data-show="error" style="display:none">
        <label>Unavailable</label>
        <span data-k="error" class="err"></span>
    </div>
    <!-- release details: shown only when update info is available (latest_version is sent) -->
    <div data-show="latest_version" style="display:none">
    <div class="pure-control-group">
        <label>Latest Version</label>
        <span data-k="latest_version"></span>
    </div>
    <div class="pure-control-group">
        <label>Title</label>
        <span data-k="title" class="inline-block"></span>
    </div>
    <div class="pure-control-group">
        <label>Release Date</label>
        <span data-k="release_date"></span>
    </div>
    <div class="pure-control-group">
        <label class="align-top">Summary</label>
        <span data-k="release_summary" class="inline-block" style="white-space: pre-line"></span>
    </div>

    <div class="pure-control-group">
        <label>URL</label>
        <a data-k="release_url" target="_blank"></a>
    </div>
    </div>
    <div class="pure-controls">
        <button class="pure-button pure-button-primary btn-ok" id="refreshButton">Refresh</button>
        <button class="pure-button pure-button-primary btn-warn" id="updateButton"
            disabled>Update</button>
        &nbsp;&nbsp;<span id='updateResult'></span>
    </div>
</div>

<h2>Manual Update</h2>
<form class="pure-form pure-form-aligned strong-labels" id="f">
    <fieldset>
        <div class="pure-control-group">
            <label for="firmwareFile">Firmware File</label>
            <input type='file' name='fi' id='firmwareFile' accept='.bin' required>
        </div>
        <div class="pure-controls">
            <button type='submit' id='uploadButton' class="pure-button pure-button-primary">Upload Firmware</button>
            &nbsp;&nbsp;<span id='uploadResult'></span>
        </div>
    </fieldset>
</form>

<script>
    // Runs as this part's init function (see registerPart in index_template.html):
    //   root : this part's <div data-part> element, query it with $('#x', root)
    //   id   : this part's id ('', single-part page, not used here)

    function isValidFirmwareFile() {
        const fileInput = $('#firmwareFile', root);
        const model = document.querySelector("meta[name='description']").content;
        if (!fileInput || !model) {
            return false;
        }

        const fileName = fileInput.value.split(/(\\|\/)/g).pop();

        // Define the patterns for the filename
        const esp32Pattern = '(\\.esp32)?';
        const versionPattern = '(\\.\\d+\\.\\d+\\.\\d+)?';
        const filenamePattern1 = new RegExp(`^${model}${esp32Pattern}${versionPattern}.*\\.bin$`, 'i');
        let filenamePattern2 = null;

        // If model starts with 'W', define an additional pattern
        if (model.startsWith('W')) {
            const modelWithoutFirstChar = model.substring(1);
            filenamePattern2 = new RegExp(`^Wireless${modelWithoutFirstChar}${esp32Pattern}${versionPattern}.*\\.bin$`, 'i');
        }

        // Check if the filename matches either pattern
        if (!filenamePattern1.test(fileName) && (!filenamePattern2 || !filenamePattern2.test(fileName))) {
            alert(`You didn't select a valid Firmware file for ${model} (${model}.1.2.3.bin expected)`);
            return false;
        }
        return confirm("Please do not power off the device during the update process.");
    }

    // Compares two "x.y.z" versions: returns -1 if a < b, 1 if a > b, 0 if equal
    function compareVersions(a, b) {
        const aParts = a.split('.').map(Number);
        const bParts = b.split('.').map(Number);

        for (let i = 0; i < Math.max(aParts.length, bParts.length); i++) {
            const aPart = aParts[i] || 0;
            const bPart = bParts[i] || 0;
            if (aPart < bPart) { return -1; }
            if (aPart > bPart) { return 1; }
        }
        return 0;
    }

    function disableAllButtons() {
        $('#refreshButton', root).disabled = true;
        $('#updateButton', root).disabled = true;
        $('#firmwareFile', root).readOnly = true;
        $('#uploadButton', root).disabled = true;
    }

    function resetButtons() {
        const refreshButton = $('#refreshButton', root);
        refreshButton.innerHTML = 'Refresh';
        refreshButton.disabled = false;

        const installedVersion = $('[data-k="installed_version"]', root).textContent;
        const latestVersion = $('[data-k="latest_version"]', root).textContent;
        const updateButton = $('#updateButton', root);
        if (compareVersions(latestVersion, installedVersion) > 0) {
            updateButton.disabled = false;
            updateButton.innerHTML = 'Update';
        } else {
            updateButton.disabled = true;
            updateButton.innerHTML = latestVersion ? 'Up to date' : 'Update';
        }

        const uploadButton = $('#uploadButton', root);
        uploadButton.innerHTML = 'Upload Firmware';
        uploadButton.disabled = false;
        $('#firmwareFile', root).readOnly = false;
    }

    function getLatestUpdateInfo() {

        disableAllButtons();

        const refreshButton = $("#refreshButton", root);

        // Show loading animation
        refreshButton.innerHTML = '<span class="spinner"></span> Refreshing...';

        // clear previous values
        fillStatus(root, { error: '', latest_version: '', title: '', release_date: '', release_summary: '', release_url: '' });
        $('[data-k="release_url"]', root).removeAttribute('href');

        getJSON('/glui',
            (updateInfo) => {
                // release summary line breaks are kept by its 'white-space: pre-line' style
                fillStatus(root, updateInfo);
                // make the release url a working link
                if (updateInfo.release_url) $('[data-k="release_url"]', root).href = updateInfo.release_url;

                // Update buttons
                resetButtons();

                fadeOut($("#loadingCurrent", root));
                fadeOut($("#loadingOnline", root));

            },
            () => {

                resetButtons();
                ['#loadingCurrent', '#loadingOnline'].forEach(sel => {
                    showError($(sel, root));
                });
            }
        );
    }
    getLatestUpdateInfo();
    $("#refreshButton", root).addEventListener('click', () => { getLatestUpdateInfo(); });

    $("#updateButton", root).addEventListener('click', (evt) => {
        evt.preventDefault();
        disableAllButtons();

        $('#updateButton', root).innerHTML = '<span class="spinner"></span> <span id="progress">0%</span>';

        fetch('/update', {
            method: 'POST',
            body: $('[data-k="latest_version"]', root).textContent
        })
            .then(response => {
                if (!response.ok) {
                    return response.text().then(text => { throw new Error(text); });
                }
                const reader = response.body.pipeThrough(new TextDecoderStream()).getReader();
                let chunkAccumulator = '';
                let success = false, message = '';

                function processChunk({ done, value }) {
                    if (done) {
                        if (success) {
                            $('#progress', root).innerHTML = 'Rebooting...';
                            waitForDevice($('#updateResult', root), location.origin, 60000);
                        } else {
                            showError($('#updateResult', root), message);
                            resetButtons();
                        }
                        return;
                    }
                    chunkAccumulator += value;
                    const chunks = chunkAccumulator.split('\n');
                    chunkAccumulator = chunks.pop();
                    chunks.forEach(chunk => {
                        if (chunk.startsWith('p:')) $('#progress', root).innerHTML = `${parseInt(chunk.substring(2))}%`;
                        else if (chunk.startsWith('s:')) success = chunk.substring(2) === 'true';
                        else if (chunk.startsWith('m:')) message = chunk.substring(2);
                    });
                    reader.read().then(processChunk); // Read the next chunk
                }
                reader.read().then(processChunk); // Start reading chunks
            })
            .catch(error => {
                showError($('#updateResult', root), error.message);
                resetButtons();
            });
    });

    $("#f", root).addEventListener('submit', (evt) => {
        evt.preventDefault();
        if (!isValidFirmwareFile()) return;
        disableAllButtons();

        // Add loading animation to the submit button
        $('#uploadButton', root).innerHTML = '<span class="spinner"></span> <span id="progress">0%</span>';

        post('/fw',
            new FormData($('#f', root)),
            () => {
                $('#progress', root).innerHTML = 'Rebooting...';
                waitForDevice($('#uploadResult', root), location.origin, 60000);
            },
            (responseText) => {
                showError($('#uploadResult', root), responseText);
                $('#f', root).reset();
                resetButtons();
            },
            30000,
            function (evt) {
                if (evt.lengthComputable) {
                    const percentComplete = Math.round((evt.loaded / evt.total) * 100);
                    $('#progress', root).innerHTML = `${percentComplete}%`;
                }
            }
        );
    }
    );
</script>
