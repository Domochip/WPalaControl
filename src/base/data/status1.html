<!-- Status screen blocks are placed by type, whatever the part they come from (see #content.status in base.css) -->
<div class="w first">
    <svg class="ring" viewBox="0 0 54 54"><circle class="tr" cx="27" cy="27" r="23"/><circle class="pr" id="signalRing" cx="27" cy="27" r="23"/></svg>
    <div><div class="n" id="quality">-</div><div class="l">WiFi signal <span data-k="rssi"></span></div></div>
</div>

<div class="group dev first">
    <div class="gh">Network<span id="l" class="ld">Loading...</span><span class="end pill" id="state"><span class="dot"></span><span data-k="stastate"></span></span></div>
    <div class="list">
        <div class="row" data-show="ssid"><span class="lbl">Network</span><span class="val"><span data-k="ssid"></span><span id="bars"></span></span></div>
        <div class="row" data-show="stationip"><span class="lbl">IP address</span><span class="val"><span data-k="stationip"></span><span class="pill" data-k="stationipsource"></span></span></div>
        <div class="row" data-show="nextretry"><span class="lbl">Next retry</span><span class="val"><span data-k="nextretry"></span> s</span></div>
        <div class="row"><span class="lbl">MAC address</span><span class="val" data-k="mac"></span></div>
        <div class="row" data-show="bssid"><span class="lbl">BSSID</span><span class="val" data-k="bssid"></span></div>
        <div class="row"><span class="lbl">Access point</span><span class="val"><span class="pill" id="apmode" data-k="apmode"></span></span></div>
        <div class="row" id="discoreason" hidden><span class="lbl">Last disconnect</span><span class="val" data-k="discoreason"></span></div>
    </div>
</div>

<script>
    // Runs as this part's init function (see registerPart in index_template.html):
    //   root : this part's <div data-part> element, query it with $('#x', root)
    //   id   : this part's id ('1'), used in API endpoints like '/gs' + id

    // state -> [label, pill color]
    const stationStates = {
        off: ['Off', ''],
        connecting: ['Connecting', 'warn'],
        connected: ['Connected', 'ok'],
        lost: ['Connection lost', 'err'],
        waitretry: ['Waiting to retry', 'warn']
    };

    const disconnectReasons = {
        0: 'No disconnection',
        1: 'Unspecified',
        2: 'Authentication expired',
        3: 'Authentication leave',
        4: 'Association expired',
        8: 'Station left',
        15: '4-way handshake timeout',
        16: 'Group key update timeout',
        200: 'Beacon timeout',
        201: 'No AP found',
        202: 'Authentication failed',
        203: 'Association failed',
        204: 'Handshake timeout',
        205: 'Connection failed'
    };

    loadStatus(root, id, {
        formats: {
            stastate: v => (stationStates[v] || [v])[0],
            discoreason: v => (disconnectReasons[Number(v)] || 'Unknown') + ' (' + Number(v) + ')',
            rssi: v => '· ' + v + ' dBm',
            apmode: (v, status) => v === 'on' ? 'On · ' + status.apip : 'Off',
        },
        afterLoad: function (status) {
            $('#state', root).className = 'end pill ' + (stationStates[status.stastate] || ['', ''])[1];
            $('#apmode', root).className = 'pill' + (status.apmode === 'on' ? ' warn' : '');

            $('#discoreason', root).hidden = !(status.stationmode === 'on' && Number(status.discoreason) !== 0);

            // signal ring and bars: quality %, green / orange / red
            if (status.rssi !== undefined) {
                const quality = rssiToQuality(status.rssi);
                $('#quality', root).textContent = quality + '%';
                $('#signalRing', root).style.strokeDasharray = `${(144.5 * quality / 100).toFixed(1)} 144.5`;
                $('#signalRing', root).style.stroke = quality > 50 ? 'var(--ok)' : quality > 25 ? 'var(--warn)' : 'var(--err)';
                $('#bars', root).replaceChildren(signalBars(status.rssi));
            } else {
                $('#quality', root).textContent = 'No signal';
            }

            setIdentity(status);

            // banner of the list pane (in index_template.html): stays visible on other screens
            $('#apName').textContent = status.apssid || "module's";
            $('#connectedToAP').hidden = !(status.stationmode == 'on' && status.apmode == 'on');
        },
    });
</script>
