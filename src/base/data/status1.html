<!-- Overview blocks are placed by type, whatever the part they come from (see #content.overview in base.css) -->
<div class="card stat" style="order:0">
    <div class="lbl">WiFi signal</div>
    <div class="val"><span id="quality">-</span><small data-k="rssi"></small></div>
    <div class="meter"><i id="signalMeter"></i></div>
</div>

<div class="card half dev">
    <div class="card-h">
        <h2>Network<span id="l" class="ld">Loading...</span></h2>
        <span class="pill" id="state" style="margin-left:auto"><span class="dot"></span><span data-k="stastate"></span></span>
    </div>
    <div class="card-b">
        <dl class="kv">
            <div data-show="ssid"><dt>SSID</dt><dd><span data-k="ssid"></span> <span id="bars"></span></dd></div>
            <div data-show="stationip"><dt>Station IP</dt><dd><span data-k="stationip"></span> <span class="pill" data-k="stationipsource"></span></dd></div>
            <div data-show="nextretry"><dt>Next retry</dt><dd><span data-k="nextretry"></span> s</dd></div>
            <div><dt>MAC</dt><dd data-k="mac"></dd></div>
            <div data-show="bssid"><dt>BSSID</dt><dd data-k="bssid"></dd></div>
            <div><dt>Access point</dt><dd><span class="pill" id="apmode" data-k="apmode"></span></dd></div>
            <div id="discoreason" hidden><dt>Last disconnect</dt><dd data-k="discoreason"></dd></div>
        </dl>
    </div>
</div>

<script>
    // Runs as this part's init function (see registerPart in index_template.html):
    //   root : this part's <div data-part> element, query it with $('#x', root)
    //   id   : this part's id ('1'), used in API endpoints like '/gs' + id

    // state -> [label, pill color]
    const stationStates = {
        off: ['Off', ''],
        connecting: ['Connecting', 'warn'],
        connected: ['Connected', 'ok'],
        lost: ['Connection lost', 'err'],
        waitretry: ['Waiting to retry', 'warn']
    };

    const disconnectReasons = {
        0: 'No disconnection',
        1: 'Unspecified',
        2: 'Authentication expired',
        3: 'Authentication leave',
        4: 'Association expired',
        8: 'Station left',
        15: '4-way handshake timeout',
        16: 'Group key update timeout',
        200: 'Beacon timeout',
        201: 'No AP found',
        202: 'Authentication failed',
        203: 'Association failed',
        204: 'Handshake timeout',
        205: 'Connection failed'
    };

    loadStatus(root, id, {
        formats: {
            stastate: v => (stationStates[v] || [v])[0],
            discoreason: v => (disconnectReasons[Number(v)] || 'Unknown') + ' (' + Number(v) + ')',
            rssi: v => v + ' dBm',
            apmode: (v, status) => v === 'on' ? 'On · ' + status.apip : 'Off',
        },
        afterLoad: function (status) {
            $('#state', root).className = 'pill ' + (stationStates[status.stastate] || ['', ''])[1];
            $('#apmode', root).className = 'pill' + (status.apmode === 'on' ? ' warn' : '');

            $('#discoreason', root).hidden = !(status.stationmode === 'on' && Number(status.discoreason) !== 0);

            // signal tile and bars: quality %, green / orange / red
            if (status.rssi !== undefined) {
                const quality = rssiToQuality(status.rssi);
                $('#quality', root).textContent = quality + '%';
                $('#signalMeter', root).style.width = quality + '%';
                $('#signalMeter', root).style.background = quality > 50 ? 'var(--ok)' : quality > 25 ? 'var(--warn)' : 'var(--err)';
                $('#bars', root).replaceChildren(signalBars(status.rssi));
            } else {
                $('#quality', root).textContent = 'No signal';
            }

            setIdentity(status);

            // page-wide banner (in index_template.html): stays visible on other pages
            $('#apName').textContent = status.apssid || "module's";
            $('#connectedToAP').hidden = !(status.stationmode == 'on' && status.apmode == 'on');
        },
    });
</script>
