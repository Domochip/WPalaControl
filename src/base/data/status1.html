<h2 class="content-subhead">WiFi<span id="l" class="ld">Loading...</span></h2>
MAC: <span data-k="mac"></span><br>
Access Point: <span data-k="apmode"></span><br>
<span data-show="apip">&nbsp;&nbsp;&nbsp;&nbsp;IP: <span data-k="apip"></span><br></span>
Station: <span data-k="stationmode"></span><br>
Connection state: <span data-k="stastate"></span><br>
<span data-show="nextretry">&nbsp;&nbsp;&nbsp;&nbsp;Next retry: <span data-k="nextretry"></span> seconds<br></span>
<span id="discoreasone" style='display:none'>Last disconnection reason: <span data-k="discoreason"></span><br></span>
<span data-show="stationip">&nbsp;&nbsp;&nbsp;&nbsp;IP: <span data-k="stationip"></span><br></span>
<span data-show="stationipsource">&nbsp;&nbsp;&nbsp;&nbsp;IP Source: <span data-k="stationipsource"></span><br></span>
<span data-show="bssid">&nbsp;&nbsp;&nbsp;&nbsp;BSSID: <span data-k="bssid"></span><br></span>
<span data-show="rssi">&nbsp;&nbsp;&nbsp;&nbsp;RSSI: <span data-k="rssi"></span><br></span>

<script>
    // Runs as this part's init function (see registerPart in index_template.html):
    //   root : this part's <div data-part> element, query it with $('#x', root)
    //   id   : this part's id ('1'), used in API endpoints like '/gs' + id

    const stationStates = {
        off: 'Off',
        connecting: 'Connecting',
        connected: 'Connected',
        lost: 'Connection lost',
        waitretry: 'Waiting to retry'
    };

    const disconnectReasons = {
        0: 'No disconnection',
        1: 'Unspecified',
        2: 'Authentication expired',
        3: 'Authentication leave',
        4: 'Association expired',
        8: 'Station left',
        15: '4-way handshake timeout',
        16: 'Group key update timeout',
        200: 'Beacon timeout',
        201: 'No AP found',
        202: 'Authentication failed',
        203: 'Association failed',
        204: 'Handshake timeout',
        205: 'Connection failed'
    };

    loadStatus(root, id, {
        formats: {
            stastate: v => stationStates[v] || v,
            discoreason: v => (disconnectReasons[Number(v)] || 'Unknown') + ' (' + Number(v) + ')',
            rssi: v => v + ' dBm (' + rssiToQuality(v) + '%)',
        },
        afterLoad: function (status) {
            $("#discoreasone", root).style.display =
                (status["stationmode"] === 'on' && Number(status["discoreason"]) !== 0 ? '' : 'none');

            if (status["rssi"] !== undefined) $('[data-k="rssi"]', root).style.color = rssiToColor(status["rssi"]);

            // page-wide banner (in index_template.html): stays visible on other pages
            $("#connectedToAP").style.display =
                (status["stationmode"] == "on" && status["apmode"] == "on" ? '' : 'none');
        },
    });
</script>
