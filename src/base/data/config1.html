<form id="f">
    <div class="group">
        <div class="gh">Networks<span id="l" class="ld">Loading...</span></div>
        <div class="list" id="wnl"><div class="row msg"><span class="spin"></span><span class="lbl">Scanning for networks...</span></div></div>
    </div>

    <div class="group">
        <div class="list">
            <div class="row"><label class="k" for="s">Network name</label><input class="in" type="text" id="s" name="s" maxlength="32" placeholder="SSID" autocomplete="off"></div>
            <div class="row">
                <label class="k" for="p">Password</label><input class="in" type="password" id="p" name="p" maxlength="64">
                <button type="button" class="eye" title="Show / hide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
            </div>
            <div class="row"><label class="k" for="h">Hostname</label><input class="in" type="text" id="h" name="h" maxlength="24" autocomplete="off"></div>
        </div>
        <div class="gf">Leave the network name empty to use the module as an access point only. The hostname is the name shown in your router's device list.</div>
    </div>

    <div class="group">
        <div class="list">
            <div class="row"><label class="lbl" for="staticip">Fixed IP address</label><label class="sw"><input id="staticip" name="staticip" type="checkbox"><span></span></label></div>
            <div class="collapse" id="staticipreveal">
                <fieldset class="rows" id="staticipgroup" disabled>
                    <div class="row"><label class="k" for="ip">IP address</label><input class="in" type="text" id="ip" name="ip" inputmode="decimal" required pattern="((^|\.)((25[0-5])|(2[0-4]\d)|(1\d\d)|([1-9]?\d))){4}$"></div>
                    <div class="row"><label class="k" for="mask">Netmask</label><input class="in" type="text" id="mask" name="mask" inputmode="decimal" pattern="((^|\.)((25[0-5])|(2[0-4]\d)|(1\d\d)|([1-9]?\d))){4}$"></div>
                    <div class="row"><label class="k" for="gw">Gateway</label><input class="in" type="text" id="gw" name="gw" inputmode="decimal" pattern="((^|\.)((25[0-5])|(2[0-4]\d)|(1\d\d)|([1-9]?\d))){4}$"></div>
                    <div class="row"><label class="k" for="dns1">DNS 1</label><input class="in" type="text" id="dns1" name="dns1" inputmode="decimal" pattern="((^|\.)((25[0-5])|(2[0-4]\d)|(1\d\d)|([1-9]?\d))){4}$"></div>
                    <div class="row"><label class="k" for="dns2">DNS 2</label><input class="in" type="text" id="dns2" name="dns2" inputmode="decimal" pattern="((^|\.)((25[0-5])|(2[0-4]\d)|(1\d\d)|([1-9]?\d))){4}$"></div>
                </fieldset>
            </div>
        </div>
        <div class="gf">Off: the router gives the address (DHCP). After saving, the module reconnects and this page follows it.</div>
    </div>
</form>

<script>
    // Runs as this part's init function (see registerPart in index_template.html):
    //   root : this part's <div data-part> element, query it with $('#x', root)
    //   id   : this part's id ('1'), used in API endpoints like '/gs' + id

    $("#staticip", root).addEventListener('change', function () {
        $("#staticipgroup", root).disabled = !this.checked;
        $("#staticipreveal", root).classList.toggle('open', this.checked);
    });

    // checks the network matching the network name field
    function selectNetwork() {
        root.querySelectorAll('#wnl [data-ssid]').forEach(net => net.classList.toggle('on', net.dataset.ssid === $('#s', root).value));
    }
    $('#s', root).addEventListener('input', selectNetwork);

    // scan polling stops when the page is left (see the cleanup function at the end)
    let scanTimer;
    let stopped = false;

    function loadNetworkList() {
        getJSON("/wnl", function (scan) {
            if (stopped) return;
            if (scan.r == -2 || scan.r == -1) { //if scan not started or is in progress
                //try again in a second
                scanTimer = setTimeout(loadNetworkList, 1000);
                return;
            }
            //scan done
            // one entry per SSID (mesh/repeaters share a name): keep the strongest, best signal first
            // hidden networks (empty SSID) are skipped
            const strongest = new Map();
            for (const network of scan.wnl) {
                if (!network.SSID) continue;
                const known = strongest.get(network.SSID);
                if (!known || network.RSSI > known.RSSI) strongest.set(network.SSID, network);
            }
            const networks = [...strongest.values()].sort((a, b) => b.RSSI - a.RSSI);

            const wnl = $("#wnl", root);
            if (networks.length == 0) {
                wnl.innerHTML = '<div class="row msg"><span class="lbl">No network found</span></div>';
                return;
            }
            wnl.replaceChildren();
            for (const network of networks) {
                const item = document.createElement('button');
                item.type = 'button';
                item.className = 'row';
                item.dataset.ssid = network.SSID;
                item.innerHTML = '<svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 12l5 5 9-10"/></svg>'
                    + '<span class="lbl"></span><span class="val"></span>';
                $('.lbl', item).textContent = network.SSID;
                $('.val', item).textContent = rssiToQuality(network.RSSI) + '%';
                item.append(signalBars(network.RSSI));
                item.addEventListener('click', () => {
                    $('#s', root).value = network.SSID;
                    triggerEvent($('#s', root), 'input');
                    $('#p', root).focus();
                });
                wnl.append(item);
            }
            selectNetwork();
        }, function () {
            if (!stopped) $("#wnl", root).innerHTML = '<div class="row msg"><span class="lbl">Scan failed</span></div>';
        });
    }

    configForm(root, id, {
        afterLoad: loadNetworkList,
        // applying WiFi settings makes the device reconnect: wait for it where it will come back
        redirectUrl: function (form) {
            // no SSID: device restarts as an access point
            if (!form.s.value) return 'http://192.168.4.1';
            // static IP: device comes back on that IP
            if (form.staticip.checked && form.ip.value != '0.0.0.0') return 'http://' + form.ip.value;
            return location.origin;
        },
    });

    // Called when leaving the page: stop polling the WiFi scan
    return function () {
        stopped = true;
        clearTimeout(scanTimer);
    };
</script>
