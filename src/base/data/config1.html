<h2 class="content-subhead">WiFi<span id="l" class="ld">Loading...</span></h2>
<form class="pure-form pure-form-aligned" id='f'>
    <fieldset>
        <div class="pure-control-group">
            <label for="s">SSID</label>
            <input type='text' id='s' name='s' maxlength='32' list="wnl">
            <select id="wnl">
                <option>Searching...</option>
            </select>
        </div>
        <div class="pure-control-group">
            <label for="p">Password</label>
            <input type='password' id='p' name='p' maxlength='64'>
        </div>
        <div class="pure-control-group">
            <label for="h">Hostname</label>
            <input type='text' id='h' name='h' maxlength='24'>
        </div>
        <div class="pure-control-group">
            <label for="staticip">Static IP</label>
            <input id='staticip' name='staticip' type="checkbox">
        </div>
        <div id='staticipgroup' style='display:none'>
            <div class="pure-control-group">
                <label for="ip">IP</label>
                <input type='text' id='ip' name='ip' pattern='((^|\.)((25[0-5])|(2[0-4]\d)|(1\d\d)|([1-9]?\d))){4}$'>
                <span class="pure-form-message-inline">*</span>
            </div>
            <div class="pure-control-group">
                <label for="mask">NetMask</label>
                <input type='text' id='mask' name='mask' pattern='((^|\.)((25[0-5])|(2[0-4]\d)|(1\d\d)|([1-9]?\d))){4}$'>
            </div>
            <div class="pure-control-group">
                <label for="gw">Gateway</label>
                <input type='text' id='gw' name='gw' pattern='((^|\.)((25[0-5])|(2[0-4]\d)|(1\d\d)|([1-9]?\d))){4}$'>
            </div>
            <div class="pure-control-group">
                <label for="dns1">DNS 1</label>
                <input type='text' id='dns1' name='dns1'
                    pattern='((^|\.)((25[0-5])|(2[0-4]\d)|(1\d\d)|([1-9]?\d))){4}$'>
            </div>
            <div class="pure-control-group">
                <label for="dns2">DNS 2</label>
                <input type='text' id='dns2' name='dns2'
                    pattern='((^|\.)((25[0-5])|(2[0-4]\d)|(1\d\d)|([1-9]?\d))){4}$'>
            </div>
        </div>
        <div class="pure-controls">
            <input type='submit' value='Save' class="pure-button pure-button-primary" disabled>
        </div>
    </fieldset>
</form>
<span id='r'></span>

<script>
    // Runs as this part's init function (see registerPart in index_template.html):
    //   root : this part's <div data-part> element, query it with $('#x', root)
    //   id   : this part's id ('1'), used in API endpoints like '/gs' + id

    $("#staticip", root).addEventListener('change', function () {
        if ($("#staticip", root).checked) {
            $("#ip", root).required = true;
            $("#staticipgroup", root).style.display = '';
        }
        else {
            $("#ip", root).required = false;
            $("#staticipgroup", root).style.display = 'none';
        }
    });

    var getNetworkList = function () {

        getJSON("/wnl", function (WNL) {
            if (WNL.r == -2 || WNL.r == -1) { //if scan not started or is in progress
                //try again in a couple of seconds
                setTimeout(getNetworkList, 2000, 0);
            }
            else { //scan done
                const wnl = $("#wnl", root);
                if (wnl) {
                    if (WNL.r == 0) wnl.replaceChildren(new Option('No Network Found'));
                    else {
                        wnl.replaceChildren(new Option('Choose Your Network'));
                        for (const network of WNL.wnl) {
                            const option = new Option(`${network.SSID} (${rssiToQuality(network.RSSI)}%)`, network.SSID);
                            option.style.color = rssiToColor(network.RSSI);
                            option.selected = $("#s", root).value == network.SSID;
                            wnl.appendChild(option);
                        }
                        wnl.addEventListener('change', function () { $("#s", root).value = wnl.value });
                    }
                }
            }
        });
    }


    configForm(root, id, {
        afterLoad: function (form) {
            // a configured IP means static IP is in use
            if (form.ip.value) {
                form.staticip.checked = true;
                triggerEvent(form.staticip, 'change');
            }
            getNetworkList();
        },
        beforeSubmit: function (form) {
            // static IP settings are only kept when static IP is checked
            if (!form.staticip.checked) {
                ['ip', 'mask', 'gw', 'dns1', 'dns2'].forEach(name => form[name].value = '');
            }
        },
        redirectUrl: function (form) {
            // no SSID: device restarts as an access point
            if (!form.s.value) return 'http://192.168.4.1';
            // static IP: device comes back on that IP
            if (form.staticip.checked && form.ip.value != '0.0.0.0') return 'http://' + form.ip.value;
            return location.origin;
        },
    });

</script>
