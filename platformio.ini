; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = d1_mini

[env]
framework = arduino
extra_scripts =
    pre:src/base/pio_pre_define_PROGNAME.py
    pre:src/base/pio_pre_copy_base.py
    pre:src/base/pio_pre_build_spa.py
    pre:src/base/pio_pre_webfiles_to_headers.py
upload_speed = 921600
monitor_speed = 38400
; Exact versions (no "^"): two builds of the same commit must use the same
; libraries, today or in a year. "^7.4.3" would silently take any later 7.x.
; To upgrade a library, change its version here, build, test, and commit.
lib_deps = 
	bblanchon/ArduinoJson@7.4.3
	hmueller01/PubSubClient3@3.3.2
	domochip/Palazzetti@3.4.0

; Platform versions are pinned for the same reason as lib_deps: without a
; version, PlatformIO takes the latest platform (and the Arduino core and
; toolchain that come with it) at build time. These are the versions that
; were current when 3.7.6 was released.
[env:d1_mini]
board = d1_mini
platform = espressif8266@4.2.1
monitor_filters = esp8266_exception_decoder

[env:d1_mini_debug]
board = d1_mini
platform = espressif8266@4.2.1
monitor_filters = esp8266_exception_decoder
build_type = debug
build_flags = -DDEBUG -fstack-usage -fcallgraph-info
extra_scripts = 
    ${env.extra_scripts}
    post:src/base/pio_post_find_biggest_callstack_paths.py

[env:mhetesp32minikit]
board = mhetesp32minikit
platform = espressif32@7.1.3