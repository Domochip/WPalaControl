name: Prepare Release

on:
  workflow_dispatch:

# Reproducible builds:
# - Actions are pinned to a full commit SHA. A tag such as "v4" can be moved
#   to another commit at any time by the action's owner (or by someone who
#   compromises their account), and this job has "contents: write" on the
#   repository. The comment after each SHA gives the version it points to.
# - PlatformIO Core is pinned instead of "pip install --upgrade".
# - Platform and library versions are pinned in platformio.ini.
# To upgrade any of these, change the version (and SHA), run the workflow,
# and test the draft release before publishing it.

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          # The key changes when platformio.ini changes (new platform or
          # library version), so an upgrade never reuses stale packages.
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install PlatformIO Core
        run: pip install platformio==6.2.0

      - name: Build PlatformIO Project
        run: pio run

      - name: Get Versions
        id: versions
        run: |
          VERSION_NUMBER=$(awk -F'"' '/#define VERSION_NUMBER/ {print $2}' ./src/Main.h)
          echo "VERSION_NUMBER=${VERSION_NUMBER}" >> $GITHUB_ENV

      - name: Temporary Copy for old version update
        run: |
          find .pio/build -type f -name 'W*.bin' -exec bash -c '
            for file; do
              new_file="${file/W/Wireless}"
              cp "$file" "$new_file"
            done
          ' bash {} +

      # One SHA-256 per published .bin, in the format of "sha256sum -c".
      # Users can check a downloaded file with:
      #   sha256sum -c --ignore-missing SHA256SUMS.txt
      # The file is also printed in the job log, so the checksums can be
      # compared with what the build actually produced.
      - name: Compute checksums
        run: |
          set -euo pipefail
          # Release assets are uploaded under their file name only, so the
          # checksum file lists file names only, and they must be unique.
          find .pio/build -type f -name '*.bin' -print0 | sort -z \
            | xargs -0 --no-run-if-empty sha256sum \
            | sed -E 's#^([0-9a-f]{64})  .*/#\1  #' > SHA256SUMS.txt
          [ -s SHA256SUMS.txt ] || { echo "no firmware found"; exit 1; }
          dup=$(awk '{print $2}' SHA256SUMS.txt | sort | uniq -d)
          [ -z "$dup" ] || { echo "duplicate file names: $dup"; exit 1; }
          cat SHA256SUMS.txt

      - name: Create Draft Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          tag_name: "${{ env.VERSION_NUMBER }}"
          generate_release_notes: true
          files: |
            .pio/build/**/*.bin
            SHA256SUMS.txt
